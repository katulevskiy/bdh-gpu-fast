name: CPU profile smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  profile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run CPU profile smoke
        run: python benchmarks/profile_smoke.py
      - name: Upload profile trace
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: profile-trace-${{ github.sha }}
          path: benchmarks/traces/*.json
          if-no-files-found: error
          retention-days: 7
