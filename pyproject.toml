[build-system]
requires = ["setuptools>=61", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-gpu-opt"
version = "0.1.0"
description = "Private BDH GPU optimization sandbox — optional CUDA tril score×V extension"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch"]

[project.optional-dependencies]
dev = ["pytest", "numpy"]

# ---------------------------------------------------------------------------
# Native extension is OPT-IN via setup.py env flags (not a pyproject toggle):
#
#   pip install -e .                                          # pure Python
#   BDH_BUILD_EXT=1 pip install -e . --no-build-isolation     # C++/CUDA
#   BDH_BUILD_EXT=1 BDH_BUILD_CUDA=1 pip install -e . --no-build-isolation
#
# Without BDH_BUILD_EXT=1, setuptools installs kernels/ only. CPU refs in
# kernels/cuda_attn.py always work; missing bdh_cuda_ext imports fail soft.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["kernels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
